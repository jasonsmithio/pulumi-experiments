# Arm64 Google Axion (C4A) vLLM Deployment for Gemma 4 4B IT (google/gemma-4-4b-it)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-gemma-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemma-server
  template:
    metadata:
      labels:
        app: gemma-server
        ai.gke.io/model: gemma-4-4b-it
        ai.gke.io/inference-server: vllm
        examples.ai.gke.io/source: user-guide
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64
      nodeSelector:
        cloud.google.com/gke-nodepool: "axion-nodepool"
      containers:
      - name: inference-server
        image: public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:latest
        resources:
          requests:
            cpu: "12"
            memory: "24Gi"
          limits:
            cpu: "15"
            memory: "40Gi"
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
        - --model=$(MODEL_ID)
        - --dtype=bfloat16
        - --host=0.0.0.0
        - --port=8000
        - --max-model-len=8192
        - --max-num-seqs=8
        - --enable-auto-tool-choice
        - --tool-call-parser=pythonic
        env:
        - name: MODEL_ID
          value: google/gemma-4-4b-it
        - name: VLLM_TARGET_DEVICE
          value: "cpu"
        - name: OMP_NUM_THREADS
          value: "14"
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: "0-13"
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "16"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: hf_api_token
              optional: true
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: hf_api_token
              optional: true
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: llm-service
spec:
  selector:
    app: gemma-server
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
